[pytest]
# Plusieurs Lambdas indépendantes sous backend/ (tenders_api/,
# reference_data_api/...) partagent des noms de fichiers de test identiques
# (test_db_retry.py, conftest.py...) sans être de vrais packages Python
# (imports plats requis par le runtime Lambda — voir chaque conftest.py).
# --import-mode=importlib évite les collisions de noms de module lors d'un
# run combiné (`pytest backend/`) sans avoir à ajouter des __init__.py qui
# finiraient vendorisés dans les zips Lambda.
addopts = --import-mode=importlib
