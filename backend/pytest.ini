[pytest]
# Plusieurs Lambdas indépendantes sous backend/ (tenders_api/,
# reference_data_api/, users_api/...) partagent des noms de fichiers de
# test identiques (test_db_retry.py, conftest.py...) sans être de vrais
# packages Python (imports plats requis par le runtime Lambda — voir
# chaque conftest.py). --import-mode=importlib évite les collisions de
# noms de module lors de la COLLECTE de ces fichiers de test, sans avoir à
# ajouter des __init__.py qui finiraient vendorisés dans les zips Lambda.
#
# Ça ne suffit PAS à isoler le code testé lui-même : `import auth`/`import
# db`/`import errors` (identiques dans chaque Lambda) restent mis en cache
# dans sys.modules par nom nu — un run combiné `pytest backend/` peut donc
# faire tester par erreur le auth.py d'une AUTRE Lambda, silencieusement
# tant que les fichiers sont fonctionnellement identiques (bug réel
# constaté le 2026-08-07 dès que auth.py de tenders_api a divergé des
# autres — voir docs/LECONS-APPRISES-AWS-SERVERLESS.md). Toujours lancer
# les tests via `make test` (backend/Makefile, un process pytest séparé
# par Lambda) — jamais `pytest backend/` directement malgré ce addopts.
addopts = --import-mode=importlib
